[pytest]
; Adds backend/ to sys.path so `from main import app`, `from neo4j_client import Neo4jClient`,
; etc. resolve the same way they do when uvicorn runs "main:app" from inside backend/ -
; regardless of which directory `pytest` is invoked from.
pythonpath = backend

testpaths = backend/tests

; pytest-asyncio 0.23.x: auto mode means async def test_ / async fixtures work
; without needing @pytest.mark.asyncio on every single test function.
asyncio_mode = auto

; anyio (a transitive dependency of httpx) ships its own pytest plugin that
; auto-registers and can compete with pytest-asyncio for event-loop control
; when async fixtures are chained (e.g. neo4j_client used by another async
; fixture) - causing "Future attached to a different loop" errors on Windows.
; We only use pytest-asyncio here, so anyio's plugin is disabled explicitly.
addopts = -p no:anyio

; The app's own routes (routes_scan.py, routes_graph.py, main.py) each create
; a MODULE-LEVEL Neo4jClient() singleton that persists for the whole pytest
; process, not just one test. pytest-asyncio's default is a fresh event loop
; per test function - the second test to touch Neo4j through the API would
; try to reuse a driver socket bound to a different (closed) loop and crash
; the same way conftest.py's neo4j_client fixture did. Sharing one event
; loop for the entire session keeps every async object on the same loop.
asyncio_default_fixture_loop_scope = session